<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" fill="none">
  <!-- Certificate illustration for the Academy certification card; replace with final artwork if needed. -->
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e3a412"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a63d8"/>
      <stop offset="1" stop-color="#0a48b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0a1f44" flood-opacity=".14"/>
    </filter>
  </defs>

  <g transform="rotate(-6 190 140)">
    <!-- blue card behind -->
    <rect x="44" y="34" width="292" height="210" rx="14" fill="#2f78e8"/>
    <!-- certificate -->
    <g filter="url(#shadow)">
      <rect x="36" y="44" width="292" height="210" rx="14" fill="#ffffff"/>
    </g>
    <rect x="46" y="54" width="272" height="190" rx="10" stroke="#1a63d8" stroke-width="2"/>
    <!-- bottom wave -->
    <path d="M47 210c40-14 80-6 118 6s80 10 152-14v30a10 10 0 0 1-10 10H57a10 10 0 0 1-10-10z" fill="url(#wave)" opacity=".9"/>
    <path d="M47 222c50-10 96 0 140 8s82 4 130-12v14a10 10 0 0 1-10 10H57a10 10 0 0 1-10-10z" fill="#5c9bf0" opacity=".55"/>

    <!-- academy mark -->
    <path d="M128 78l20-7 20 7-20 7z" fill="#1a63d8"/>
    <path d="M136 82v7c4 3 20 3 24 0v-7l-12 4z" fill="#0a48b8"/>
    <text x="176" y="80" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0a1f44">cruisestack.ai</text>
    <text x="182" y="92" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0a1f44">Academy</text>

    <text x="182" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0a1f44">Module Certification</text>
    <rect x="122" y="142" width="120" height="5" rx="2.5" fill="#d9dee6"/>
    <rect x="132" y="155" width="100" height="5" rx="2.5" fill="#d9dee6"/>
    <rect x="146" y="168" width="72" height="5" rx="2.5" fill="#d9dee6"/>

    <!-- laurels -->
    <g fill="#e8c46a">
      <ellipse cx="86" cy="150" rx="4" ry="9" transform="rotate(-30 86 150)"/>
      <ellipse cx="80" cy="164" rx="4" ry="9" transform="rotate(-10 80 164)"/>
      <ellipse cx="82" cy="179" rx="4" ry="9" transform="rotate(15 82 179)"/>
      <ellipse cx="91" cy="192" rx="4" ry="9" transform="rotate(40 91 192)"/>
      <ellipse cx="278" cy="150" rx="4" ry="9" transform="rotate(30 278 150)"/>
      <ellipse cx="284" cy="164" rx="4" ry="9" transform="rotate(10 284 164)"/>
    </g>
    <path d="M92 142c-12 18-12 40 4 58M272 142c8 10 12 20 12 30" stroke="#d7ab4a" stroke-width="2" stroke-linecap="round"/>

    <!-- seal with ribbon -->
    <path d="M262 214l-10 34 14-8 8 14 6-36z" fill="#1a63d8"/>
    <path d="M290 214l10 34-14-8-8 14-6-36z" fill="#0a48b8"/>
    <circle cx="276" cy="206" r="24" fill="url(#seal)"/>
    <circle cx="276" cy="206" r="17" fill="none" stroke="#fff3c4" stroke-width="2"/>
    <path d="M276 194l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#fff3c4"/>
  </g>
</svg>
